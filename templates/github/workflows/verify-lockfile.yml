# dev-standards: .github/workflows/actions.lock がワークフローと食い違っていないか、
# 固定したコミットが上流で検証できるかを確かめる（.claude/rules/git.md §5）。
# 元: https://github.com/github/gh-actions-lock/blob/v0.4.0/.github/workflows/verify-lockfile.yml
name: verify-lockfile
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      - run: gh actions-lock --verify

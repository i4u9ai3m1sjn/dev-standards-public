# dev-standards: PR タイトルが Conventional Commits の形かをチェックする（.claude/rules/git.md）。
name: pr-title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            style
            revert
          requireScope: false
          # 説明は日本語で書くので、先頭の大文字・小文字は問わない
          subjectPattern: ^.+$
